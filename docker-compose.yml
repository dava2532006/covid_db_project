# Opsional: jalankan MySQL dan MongoDB lokal dengan Docker
#   docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: covid_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  mongo:
    image: mongo:7
    container_name: covid_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mysql_data:
  mongo_data:
